name: cbci-probe

# Smoke test of the CI core on hosted runners: core -> plan -> lint -> sdist -> one
# linux x86_64 wheel.

on:
  workflow_dispatch:
    inputs:
      cbci_repo:
        description: "Public repository holding the CI core."
        required: false
        default: "couchbaselabs/sdkbuild-jenkinsfiles"
        type: string
      cbci_ref:
        description: "CI core ref (branch/tag/sha). A work branch tests unpublished core."
        required: false
        default: "master"
        type: string
      cbci_path:
        description: "Directory of the CI core inside cbci_repo."
        required: false
        default: "python/ci_scripts_v2"
        type: string
      libc:
        description: "linux libc flavor for the probe wheel."
        required: false
        default: "manylinux"
        type: choice
        options:
          - manylinux
          - musllinux
      custom_image:
        description: "Build the couchbase manylinux image first (matches Jenkins). Off uses the stock pypa image."
        required: false
        default: true
        type: boolean
      config_override:
        description: "JSON object deep-merged over ci-config.yaml (CBCI_CONFIG_OVERRIDE)."
        required: false
        default: ""
        type: string
      verbose:
        description: "Verbose compiler/CMake output."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cbci-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CBCI_PROJECT_TYPE: OPERATIONAL
  CORE: ${{ github.workspace }}/core
  # Kept apart from the core so the core never dirties the version stamp or gets linted.
  SDK: ${{ github.workspace }}/sdk
  # Tooling interpreter; gha.py fails if it differs from support.default_python.
  CBCI_DEFAULT_PYTHON: "3.11"

jobs:
  core:
    name: core (${{ inputs.cbci_ref }})
    runs-on: ubuntu-24.04
    steps:
      # bootstrap.sh verifies every file against its pinned sha256.
      - name: Stage CI core
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${CBCI_REPO}/${CBCI_REF}/${CBCI_PATH}"
          echo "CI core from ${base}"
          curl -fsSL "${base}/bootstrap.sh" -o "${RUNNER_TEMP}/bootstrap.sh"
          CBCI_BASE_URL="$base" CBCI_DEST="$CORE" bash "${RUNNER_TEMP}/bootstrap.sh"
        env:
          CBCI_REPO: ${{ inputs.cbci_repo }}
          CBCI_REF: ${{ inputs.cbci_ref }}
          CBCI_PATH: ${{ inputs.cbci_path }}

      # Re-checked by every consumer: artifacts are not a verified channel.
      - name: Record core digests
        working-directory: core
        run: |
          set -euo pipefail
          sha256sum ./* > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: cbci-core
          path: core/
          retention-days: 3

  plan:
    name: plan
    runs-on: ubuntu-24.04
    needs: core
    outputs:
      wheel_matrix: ${{ steps.matrix.outputs.wheel_matrix }}
    env:
      CBCI_PROJECT_ROOT: ${{ github.workspace }}/sdk
      CBCI_CONFIG_OVERRIDE: ${{ inputs.config_override }}
    steps:
      - name: Download CI core
        uses: actions/download-artifact@v8
        with:
          name: cbci-core
          path: core

      - name: Verify core digests
        working-directory: core
        run: sha256sum -c SHA256SUMS

      # upload-artifact does not preserve the executable bit.
      - name: Enable core scripts
        run: chmod +x "$CORE/tasks.sh"

      # Full depth: the commit gates and the version stamp both need history and tags.
      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          path: sdk
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}

      - name: Install engine deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate config
        run: python "$CORE/engine.py" validate-config

      - name: Display info
        run: bash "$CORE/tasks.sh" display-info

      # One build_wheel cell, picked by libc (musllinux cells have platform "alpine").
      - name: Build wheel matrix
        id: matrix
        run: |
          set -euo pipefail
          python "$CORE/gha.py" matrices > matrices.json
          matrix=$(jq -c '
            [ .build_wheel.include[]
              | select(.arch == "x86_64" and .libc == $ENV.PROBE_LIBC) ]
            | {include: .}' matrices.json)
          count=$(jq '.include | length' <<<"$matrix")
          echo "$matrix" | jq .
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 cell for x86_64/${PROBE_LIBC}, build_wheel has ${count}"
            exit 1
          fi
          echo "wheel_matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          # Via env: an input interpolated into the script would be executed.
          PROBE_LIBC: ${{ inputs.libc }}

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: probe-plan
          path: matrices.json
          retention-days: 3

  lint:
    name: lint
    runs-on: ubuntu-24.04
    needs: core
    env:
      CBCI_PROJECT_ROOT: ${{ github.workspace }}/sdk
      CBCI_CONFIG_OVERRIDE: ${{ inputs.config_override }}
    steps:
      - name: Download CI core
        uses: actions/download-artifact@v8
        with:
          name: cbci-core
          path: core

      - name: Verify core digests
        working-directory: core
        run: sha256sum -c SHA256SUMS

      - name: Enable core scripts
        run: chmod +x "$CORE/tasks.sh"

      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          path: sdk
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}

      - name: Install engine deps
        run: python -m pip install --upgrade pip pyyaml

      # CBCI_PRE_COMMIT_VERSION unset: the pin is only for agents with an old git.
      - name: Lint
        run: bash "$CORE/tasks.sh" lint
        env:
          CBCI_LOG_FILE: ${{ github.workspace }}/logs/lint.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-lint
          path: logs/
          retention-days: 3
          if-no-files-found: warn

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    needs: [core, lint]
    env:
      CBCI_PROJECT_ROOT: ${{ github.workspace }}/sdk
      CBCI_CONFIG_OVERRIDE: ${{ inputs.config_override }}
    steps:
      - name: Download CI core
        uses: actions/download-artifact@v8
        with:
          name: cbci-core
          path: core

      - name: Verify core digests
        working-directory: core
        run: sha256sum -c SHA256SUMS

      - name: Enable core scripts
        run: chmod +x "$CORE/tasks.sh"

      # Submodules here only: the sdist bakes the CPM cache the wheel builds from.
      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          path: sdk
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}

      - name: Install engine deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Build sdist
        run: bash "$CORE/tasks.sh" sdist
        env:
          CBCI_LOG_FILE: ${{ github.workspace }}/logs/sdist.log

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: probe-sdist
          path: sdk/dist/*.tar.gz
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-sdist
          path: logs/
          retention-days: 3
          if-no-files-found: warn

  wheel:
    name: wheel ${{ matrix.libc }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [core, plan, sdist]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.wheel_matrix) }}
    env:
      # CBCI_PYTHON_VERSION is empty for abi3 cells, which reads as unset.
      CBCI_BUILD_PLATFORM: ${{ matrix.platform }}
      CBCI_BUILD_ARCH: ${{ matrix.arch }}
      CBCI_BUILD_LIBC: ${{ matrix.libc }}
      CBCI_PYTHON_VERSION: ${{ matrix.python }}
      CBCI_PROJECT_ROOT: ${{ github.workspace }}/sdk
      CBCI_CONFIG_OVERRIDE: ${{ inputs.config_override }}
    steps:
      - name: Download CI core
        uses: actions/download-artifact@v8
        with:
          name: cbci-core
          path: core

      - name: Verify core digests
        working-directory: core
        run: sha256sum -c SHA256SUMS

      - name: Enable core scripts
        run: chmod +x "$CORE/tasks.sh"

      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          path: sdk
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.CBCI_DEFAULT_PYTHON }}

      - name: Install engine deps
        run: python -m pip install --upgrade pip pyyaml

      # tasks.sh builds from dist/*.tar.gz when present.
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: probe-sdist
          path: sdk/dist

      # Same image as Jenkins; off uses the stock pypa image.
      - name: Build container image
        if: ${{ inputs.custom_image }}
        run: |
          set -euo pipefail
          bash "$CORE/tasks.sh" image
          echo "${IMAGE_VAR}=${CBCI_IMAGE}" >> "$GITHUB_ENV"
        env:
          CBCI_IMAGE: ${{ matrix.image }}
          IMAGE_VAR: ${{ matrix.image_var }}

      - name: Build wheel
        run: bash "$CORE/tasks.sh" wheel
        env:
          CBCI_BUILD_VERBOSITY: ${{ inputs.verbose && '3' || '' }}
          CBCI_VERBOSE_MAKEFILE: ${{ inputs.verbose && 'on' || '' }}
          CBCI_LOG_FILE: ${{ github.workspace }}/logs/wheel.log

      # The stripped wheel's .gnu_debuglink must name a .debug companion that exists.
      - name: Check artifacts
        working-directory: sdk
        run: |
          set -euo pipefail
          shopt -s nullglob
          release=(wheelhouse/dist/*.whl)
          companions=(wheelhouse/dist_debug/*.debug)
          echo "release wheels:    ${release[*]:-none}"
          echo "debug companions:  ${companions[*]:-none}"
          [ "${#release[@]}" -ge 1 ] || { echo "::error::no release wheel"; exit 1; }
          [ "${#companions[@]}" -ge 1 ] || { echo "::error::no .debug companion"; exit 1; }

          so=$(unzip -Z1 "${release[0]}" | grep -E '\.so$' | head -1)
          unzip -o -q "${release[0]}" "$so" -d unpacked

          # `readelf -p` exits 0 when the section is missing, so match the name.
          link=$(readelf -p .gnu_debuglink "unpacked/$so" 2>/dev/null \
                 | grep -oE '[A-Za-z0-9._+-]+\.debug' | head -1 || true)
          [ -n "$link" ] || { echo "::error::release .so carries no .gnu_debuglink"; exit 1; }
          [ -f "wheelhouse/dist_debug/$link" ] \
            || { echo "::error::debuglink names $link but no such file in dist_debug"; exit 1; }
          echo "debuglink -> $link (companion present)"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: probe-wheel-${{ matrix.libc }}-${{ matrix.arch }}
          path: sdk/wheelhouse/dist/*.whl
          retention-days: 3

      # Off unless build.archive_debug_symbols says so (see config_override).
      - name: Upload debug artifacts
        if: ${{ matrix.archive_debug }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-debug-${{ matrix.libc }}-${{ matrix.arch }}
          path: sdk/wheelhouse/dist_debug/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-wheel-${{ matrix.libc }}-${{ matrix.arch }}
          path: logs/
          retention-days: 3
          if-no-files-found: warn
